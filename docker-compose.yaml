services:
    backend:
        build: ./backend
        depends_on:
            - migration
            - redis-cache
            - chromadb
        volumes:
            - ./backend:/app
        ports:
            - "4000:3000"
        environment:
            - DB_PASSWORD=Radhe@1234
            - DB_PORT=5432
            - DB_HOST=postgres
            - DB_USER=postgres
            - DB_NAME=meet

            - SECRET_KEY=knnfiyt8ugrhh49

            - CHROMA_URL=http://chromadb:8000

            - REDIS_URL=redis://redis-cache:6379
        env_file:
            - .env
    dashboard:
        build: ./dashboard
        volumes:
            - ./dashboard:/app
        ports:
            - "5173:5173"

    postgres:
        image: postgres:17
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=Radhe@1234
            - POSTGRES_DB=meet
        ports:
            - "5433:5432"
        volumes:
            - pg_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres -d meet" ]
            interval: 5s
            timeout: 5s
            retries: 5

    redis-cache:
        image: redis:7
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

    migration:
        build: ./backend
        command: npx node-pg-migrate up
        depends_on:
            postgres:
                condition: service_healthy
        restart: "no"
        environment:
            - DATABASE_URL=postgres://postgres:Radhe@1234@postgres:5432/meet

    chromadb:
        image: chromadb/chroma
        ports:
            - "8000:8000"
        healthcheck:
            test: [ "CMD-SHELL", "curl -f http://chromadb:8000/healthcheck" ]
            interval: 5s
            timeout: 5s
            retries: 5
        volumes:
            - chroma_data:/chroma
volumes:
    pg_data:
    redis_data:
    chroma_data:
